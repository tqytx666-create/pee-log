<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>宝宝记录小本</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--text:#1f1f1f;--sub:#7a7a7a;--accent:#2f6f5e;--line:#e6e4df;--danger:#c0392b;--pee:#3a86c8;--poo:#a0702c;--drink:#2f9e8f;--other:#8a63b8}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--card:#222;--text:#eee;--sub:#999;--accent:#5fb89e;--line:#333;--danger:#e57368;--pee:#6aaee6;--poo:#d2a25f;--drink:#5fcdbd;--other:#b99be0}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,"PingFang SC",sans-serif}
main{max-width:480px;margin:0 auto;padding:18px 14px 70px}
h1{font-size:18px;margin:0 0 14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
button{font:inherit;cursor:pointer;color:inherit}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.btns button{border:none;border-radius:14px;padding:14px 4px;color:#fff;font-weight:600;font-size:15px;line-height:1.3}
.btns button span{display:block;font-size:22px}
.btns button:active{transform:scale(.97)}
.b-pee{background:var(--pee)}.b-poo{background:var(--poo)}.b-drink{background:var(--drink)}.b-other{background:var(--other)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat h3{margin:0 0 6px;font-size:14px}
.lbl{font-size:12px;color:var(--sub)}.val{font-size:17px;font-weight:600}
.next{font-size:13px;color:var(--sub);margin-top:6px}
.tips{border-color:var(--danger)}.tips b{color:var(--danger)}.tips div{margin:3px 0;font-size:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:none}
.ev .t{font-size:13px;color:var(--sub)}
.ev .k{font-weight:600}
.ev .dd{font-size:13px;color:var(--sub);margin-top:1px}
li .ops{white-space:nowrap}
li .ops button{border:none;background:none;font-size:13px;padding:2px 4px;color:var(--sub)}
li .ops .del{color:var(--danger)}
.foot{text-align:center;font-size:12px;color:var(--sub);margin-top:6px}
.foot button{border:none;background:none;color:var(--sub);text-decoration:underline;font-size:12px}
.note{font-size:12px;color:var(--sub);text-align:center;margin-top:10px}
#mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px 24px;max-height:88vh;overflow:auto;z-index:11;display:none}
#sheet h2{margin:0 0 10px;font-size:17px}
.fld{margin:12px 0}
.fld .lbl{margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip small{display:block;font-size:11px;color:inherit;opacity:.75}
.chip.shape{width:calc(50% - 3px);text-align:left;border-radius:10px;padding:6px 10px;font-size:13px}
input[type=text],input[type=number],input[type=datetime-local]{width:100%;font:inherit;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.save{width:100%;margin-top:8px;padding:13px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:16px}
.cancel{width:100%;margin-top:6px;padding:10px;border:none;background:none;color:var(--sub)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:20;white-space:nowrap}
#toast button{border:none;background:none;color:#7fd1ff;font-size:14px;margin-left:10px}
</style>
</head>
<body>
<main>
  <h1>宝宝记录小本</h1>

  <div class="btns">
    <button class="b-pee" id="bPee"><span>💧</span>尿尿</button>
    <button class="b-poo" id="bPoo"><span>💩</span>便便</button>
    <button class="b-drink" id="bDrink"><span>🥛</span>喝水奶</button>
    <button class="b-other" id="bOther"><span>📝</span>其它</button>
  </div>

  <div class="card tips" id="tips" style="display:none"></div>

  <div class="grid2">
    <div class="card stat"><h3 style="color:var(--pee)">💧 尿尿</h3>
      <div class="lbl">今天</div><div class="val" id="peeToday">0 次</div>
      <div class="lbl" style="margin-top:6px">平均间隔</div><div class="val" id="peeAvg">—</div>
      <div class="next" id="peeNext">—</div>
    </div>
    <div class="card stat"><h3 style="color:var(--poo)">💩 便便</h3>
      <div class="lbl">今天</div><div class="val" id="pooToday">0 次</div>
      <div class="lbl" style="margin-top:6px">平均间隔</div><div class="val" id="pooAvg">—</div>
      <div class="next" id="pooNext">—</div>
    </div>
  </div>
  <div class="card" style="padding:10px 14px">
    <div class="grid2">
      <div><div class="lbl">今天喝了</div><div class="val" id="drinkToday">0 ml</div></div>
      <div><div class="lbl">最近便便形态</div><div class="val" id="shapes" style="font-size:15px">—</div></div>
    </div>
  </div>

  <div class="card">
    <div class="filters" id="ctabs"></div>
    <div id="chart"></div>
    <div class="lbl" id="chartNote" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <div class="filters" id="filters"></div>
    <ul id="list"></ul>
  </div>

  <div class="note">仅作记录参考，宝宝不舒服请及时看医生</div>
  <div class="foot"><span id="sync"></span> · <button id="exp">导出备份</button></div>
</main>

<div id="mask"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
const SB='https://oznaumvwecurqmfjqwne.supabase.co', KEYAPI='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im96bmF1bXZ3ZWN1cnFtZmpxd25lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4OTE2NTEsImV4cCI6MjEwMjQ2NzY1MX0.bJfcVFpFspYdmwoeb_tDu77_IJsSfk8alJbtNrsJgPI';
const KEY='timelog.v2';
const KINDS={pee:{n:'尿尿',e:'💧'},poo:{n:'便便',e:'💩'},drink:{n:'喝水奶',e:'🥛'},other:{n:'其它',e:'📝'}};
const SHAPES=[
 [1,'一粒粒硬球','很干，像羊粪蛋'],[2,'硬香肠有疙瘩','偏干'],[3,'香肠有裂纹','正常'],[4,'光滑软香肠','最理想'],
 [5,'软块边缘清楚','偏软'],[6,'糊状没形状','偏稀'],[7,'水样','腹泻样']];
const POO_COLORS=['黄','棕','浅棕','绿','黑','红/带血','白灰'];
const PEE_COLORS=['无色','淡黄','黄','深黄','红/粉'];
const AMT=['少','中','多'];

// 口令:从链接 #k=xxxx 读取并记住;口令不进代码仓库
let code='';
try{const m=location.hash.match(/k=([A-Za-z0-9_-]{12,})/);if(m){localStorage.setItem('timelog.code',m[1]);history.replaceState(null,'',location.pathname)}code=localStorage.getItem('timelog.code')||''}catch(e){}
let data={events:[],pending:[]};
try{
  const s=localStorage.getItem(KEY);if(s)Object.assign(data,JSON.parse(s));
  if(!data.events.length){ // 从旧版(只有尿尿时间)迁移到本地,云端以服务器为准
    const o=localStorage.getItem('timelog.v1');
    if(o){const od=JSON.parse(o);data.events=(od.times||[]).map(t=>({t,k:'pee',d:{}}))}
  }
}catch(e){}
data.pending=data.pending||[];
let filter='all';
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({events:data.events,pending:data.pending}))}catch(e){}};
const p2=n=>String(n).padStart(2,'0');
const fmt=t=>{const d=new Date(t);return `${d.getMonth()+1}月${d.getDate()}日 ${p2(d.getHours())}:${p2(d.getMinutes())}`};
const dur=ms=>{const m=Math.round(ms/60000);if(m<60)return m+'分钟';const h=Math.floor(m/60),r=m%60;if(h<48)return h+'小时'+(r?r+'分':'');const d=Math.floor(h/24);return d+'天'+(h%24)+'小时'};
const dayWord=t=>{const d=new Date(t),n=new Date();const a=new Date(d.getFullYear(),d.getMonth(),d.getDate()),b=new Date(n.getFullYear(),n.getMonth(),n.getDate());const k=Math.round((a-b)/864e5);return k===0?'今天':k===1?'明天':k===-1?'昨天':k===2?'后天':''};
const toLocalInput=t=>{const d=new Date(t);return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- 云同步(没口令就只存本机)----
async function rpc(fn,body){
  const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEYAPI,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error(fn+' '+r.status);
  return r.status===204?null:r.json();
}
function status(t,bad){const e=$('sync');e.textContent=t;e.style.color=bad?'var(--danger)':'var(--sub)'}
let syncing=false,again=false;
// 把还没上传的操作叠加到服务器列表上,避免同步期间新记的记录"消失"
function applyPending(list){
  const out=list.slice();
  data.pending.forEach(op=>{
    const i=out.findIndex(e=>e.t===op.t&&e.k===op.k);
    if(op.op==='add'){const ev={t:op.t,k:op.k,d:op.d||{}};if(i>=0)out[i]=ev;else out.push(ev)}
    else if(i>=0)out.splice(i,1);
  });
  return out;
}
async function sync(){
  if(!code){status('只存在本机（用带口令的链接打开才会同步）');return}
  if(syncing){again=true;return}
  syncing=true;
  try{
    do{
      again=false;
      while(data.pending.length){
        const op=data.pending[0];
        if(op.op==='add')await rpc('kl_add',{p_code:code,p_ms:op.t,p_kind:op.k,p_d:op.d||{}});
        else await rpc('kl_del',{p_code:code,p_ms:op.t,p_kind:op.k});
        data.pending.shift();save();
      }
      const list=await rpc('kl_list',{p_code:code});
      data.events=applyPending(list);save();render();
    }while(again||data.pending.length);
    status('已同步 · '+p2(new Date().getHours())+':'+p2(new Date().getMinutes()));
  }catch(e){status('同步失败，已先存在本机，稍后自动重试',true)}
  syncing=false;
}
function putEvent(t,k,d){
  data.events=data.events.filter(e=>!(e.t===t&&e.k===k));
  data.events.push({t,k,d});
  data.pending.push({op:'add',t,k,d});save();render();sync();
}
function delEvent(t,k){
  data.events=data.events.filter(e=>!(e.t===t&&e.k===k));
  data.pending.push({op:'del',t,k});save();render();sync();
}

// ---- 统计 ----
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const of=k=>data.events.filter(e=>e.k===k).sort((a,b)=>a.t-b.t);
const t0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
function interval(k,todayId,avgId,nextId){
  const ts=of(k).map(e=>e.t);
  $(todayId).textContent=ts.filter(t=>t>=t0()).length+' 次';
  const gaps=[];for(let i=1;i<ts.length;i++)gaps.push(ts[i]-ts[i-1]);
  if(!gaps.length){$(avgId).textContent='—';$(nextId).textContent=ts.length?'再记一次就能预测':'还没有记录';return}
  const avg=mean(gaps),nx=ts[ts.length-1]+avg;
  $(avgId).textContent=dur(avg);
  const w=dayWord(nx);
  $(nextId).textContent=`预计下次 ${w} ${p2(new Date(nx).getHours())}:${p2(new Date(nx).getMinutes())}`+(nx<Date.now()?'（已超 '+dur(Date.now()-nx)+'）':'');
}
function detailText(e){
  const d=e.d||{};const a=[];
  if(e.k==='poo'){if(d.s){const s=SHAPES.find(x=>x[0]===d.s);a.push(`${d.s}型${s?'·'+s[1]:''}`)}if(d.c)a.push(d.c+'色');if(d.q)a.push('量'+d.q)}
  if(e.k==='pee'){if(d.c)a.push(d.c);if(d.q)a.push('量'+d.q)}
  if(e.k==='drink'){a.push((d.w||'水')+(d.ml?' '+d.ml+'ml':''))}
  if(e.k==='other'){a.push(d.name||'其它')}
  if(d.n)a.push('「'+d.n+'」');
  return a.join(' · ');
}

// ---- 温和提醒(参考用,不是诊断)----
function tips(){
  const T=[],now=Date.now();
  const poo=of('poo'),pee=of('pee');
  const lastPoo=poo[poo.length-1];
  if(lastPoo&&now-lastPoo.t<36e5*24){
    const c=(lastPoo.d||{}).c;
    if(c==='红/带血'||c==='黑'||c==='白灰')T.push(`最近一次便便是「${c}」色，不常见，建议拍照问医生。`);
  }
  const loose=poo.filter(e=>e.t>=t0()&&(e.d||{}).s>=6).length;
  if(loose>=3)T.push(`今天已有 ${loose} 次偏稀的便便，注意多补水，持续或精神差请就医。`);
  if(lastPoo&&now-lastPoo.t>72*36e5)T.push(`已经 ${dur(now-lastPoo.t)} 没记录到便便，留意是否偏干、肚子是否胀。`);
  const lastPee=pee[pee.length-1];
  if(lastPee&&now-lastPee.t>8*36e5&&new Date().getHours()>=9&&new Date().getHours()<22)T.push(`已经 ${dur(now-lastPee.t)} 没记录到尿尿（若只是忘了点可忽略），注意是否喝水少。`);
  if(lastPee&&now-lastPee.t<36e5*24&&(lastPee.d||{}).c==='红/粉')T.push('最近一次尿尿颜色偏红/粉，建议问医生。');
  const el=$('tips');
  if(T.length){el.style.display='';el.innerHTML='<b>温馨提醒</b>'+T.map(x=>'<div>• '+esc(x)+'</div>').join('')}else el.style.display='none';
}


// ---- 图表(纯SVG,跟随明暗主题)----
let chartTab='today';
const CTABS=[['today','今天'],['week','近7天'],['shape','便便形态'],['hour','全天分布']];
const POO_HEX={'黄':'#e0b020','棕':'#8b5a2b','浅棕':'#c4955a','绿':'#5a9e4b','黑':'#222222','红/带血':'#d33a2c','白灰':'#bdbdbd'};
const BAD_POO=['红/带血','黑','白灰'];
const svg=(h,inner)=>`<svg viewBox="0 0 340 ${h}" width="100%" style="display:block" role="img">${inner}</svg>`;
const dd=e=>e.d||{};
const empty=m=>`<div class="lbl" style="padding:26px 0;text-align:center">${m}</div>`;

function chartToday(){
  const s=t0(),W=340,L=30,R=10,iw=W-L-R,x=t=>L+(t-s)/864e5*iw;
  let g='',n={pee:0,poo:0,drink:0};
  ['pee','poo','drink','other'].forEach((k,i)=>{
    const y=20+i*26;
    g+=`<text x="2" y="${y+5}" font-size="14">${KINDS[k].e}</text><line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/>`;
    data.events.filter(e=>e.k===k&&e.t>=s&&e.t<s+864e5).forEach(e=>{
      if(n[k]!==undefined)n[k]++;
      const r=k==='drink'?Math.min(9,3.5+(dd(e).ml||0)/35):6;
      const bad=k==='poo'&&BAD_POO.includes(dd(e).c);
      g+=`<circle cx="${x(e.t)}" cy="${y}" r="${r}" fill="var(--${k})" fill-opacity=".85"${bad?' stroke="var(--danger)" stroke-width="2.5"':''}/>`;
    });
  });
  [0,6,12,18,24].forEach(h=>{const xx=L+h/24*iw;g+=`<line x1="${xx}" x2="${xx}" y1="8" y2="116" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${xx}" y="132" font-size="10" fill="var(--sub)" text-anchor="middle">${h}点</text>`});
  const nx=x(Date.now());g+=`<line x1="${nx}" x2="${nx}" y1="6" y2="118" stroke="var(--danger)" stroke-width="1.5"/><text x="${Math.min(nx+3,W-24)}" y="12" font-size="10" fill="var(--danger)">现在</text>`;
  $('chartNote').textContent=`今天 尿尿 ${n.pee} 次 · 便便 ${n.poo} 次 · 喝 ${of('drink').filter(e=>e.t>=s).reduce((a,e)=>a+(Number(dd(e).ml)||0),0)} ml（红圈=颜色不常见）`;
  return svg(140,g);
}

function chartWeek(){
  const W=340,L=8,R=8,cw=(W-L-R)/7,days=[];
  const base=t0();
  for(let i=6;i>=0;i--)days.push(base-i*864e5);
  const cnt=(k,d)=>data.events.filter(e=>e.k===k&&e.t>=d&&e.t<d+864e5).length;
  const ml=d=>data.events.filter(e=>e.k==='drink'&&e.t>=d&&e.t<d+864e5).reduce((a,e)=>a+(Number(dd(e).ml)||0),0);
  const pee=days.map(d=>cnt('pee',d)),poo=days.map(d=>cnt('poo',d)),dr=days.map(ml);
  if(![...pee,...poo,...dr].some(v=>v>0))return empty('近7天还没有记录');
  const mx=Math.max(4,...pee,...poo),mxd=Math.max(300,...dr);
  const H1=84,top=16;let g='';
  g+=`<text x="${L}" y="10" font-size="10" fill="var(--sub)">每天次数</text>`;
  days.forEach((d,i)=>{
    const x0=L+i*cw,hp=pee[i]/mx*H1,hk=poo[i]/mx*H1;
    g+=`<rect x="${x0+6}" y="${top+H1-hp}" width="16" height="${hp}" rx="3" fill="var(--pee)"/><rect x="${x0+24}" y="${top+H1-hk}" width="16" height="${hk}" rx="3" fill="var(--poo)"/>`;
    if(pee[i])g+=`<text x="${x0+14}" y="${top+H1-hp-3}" font-size="10" fill="var(--sub)" text-anchor="middle">${pee[i]}</text>`;
    if(poo[i])g+=`<text x="${x0+32}" y="${top+H1-hk-3}" font-size="10" fill="var(--sub)" text-anchor="middle">${poo[i]}</text>`;
    const wd='日一二三四五六'[new Date(d).getDay()];
    g+=`<text x="${x0+cw/2}" y="${top+H1+13}" font-size="11" fill="${i===6?'var(--text)':'var(--sub)'}" text-anchor="middle" font-weight="${i===6?700:400}">${i===6?'今':'周'+wd}</text>`;
  });
  g+=`<line x1="${L}" x2="${W-R}" y1="${top+H1}" y2="${top+H1}" stroke="var(--line)"/>`;
  const y2=top+H1+56,H2=44;
  g+=`<text x="${L}" y="${top+H1+34}" font-size="10" fill="var(--sub)">每天喝（毫升）</text>`;
  days.forEach((d,i)=>{const x0=L+i*cw,h=dr[i]/mxd*H2;
    g+=`<rect x="${x0+10}" y="${y2+H2-h}" width="26" height="${h}" rx="3" fill="var(--drink)" fill-opacity=".85"/>`;
    if(dr[i])g+=`<text x="${x0+23}" y="${y2+H2-h-3}" font-size="10" fill="var(--sub)" text-anchor="middle">${dr[i]}</text>`});
  g+=`<line x1="${L}" x2="${W-R}" y1="${y2+H2}" y2="${y2+H2}" stroke="var(--line)"/>`;
  const av=a=>(a.reduce((x,y)=>x+y,0)/7).toFixed(1);
  $('chartNote').innerHTML=`近7天平均每天：<span style="color:var(--pee)">尿 ${av(pee)} 次</span> · <span style="color:var(--poo)">便 ${av(poo)} 次</span> · <span style="color:var(--drink)">喝 ${Math.round(dr.reduce((x,y)=>x+y,0)/7)} ml</span>`;
  return svg(y2+H2+8,g);
}

function chartShape(){
  const ev=of('poo').filter(e=>dd(e).s).slice(-14);
  if(!ev.length)return empty('记便便时选一下形态，这里就会出现趋势');
  const W=340,L=26,R=10,T=10,B=22,H=150,ih=H-T-B,iw=W-L-R;
  const y=v=>T+(7-v)/6*ih,x=i=>ev.length===1?L+iw/2:L+i/(ev.length-1)*iw;
  let g=`<rect x="${L}" y="${y(5)}" width="${iw}" height="${y(3)-y(5)}" fill="#4caf7a" fill-opacity=".14"/><text x="${W-R-2}" y="${y(5)+11}" font-size="10" fill="#4caf7a" text-anchor="end">正常区 3–5型</text>`;
  for(let v=1;v<=7;v++)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="${v===4?'':'2 3'}"/><text x="${L-6}" y="${y(v)+4}" font-size="10" fill="var(--sub)" text-anchor="end">${v}</text>`;
  g+=`<text x="${W-R-2}" y="${y(7)+11}" font-size="9" fill="var(--sub)" text-anchor="end">↑ 偏稀</text><text x="${W-R-2}" y="${y(1)-4}" font-size="9" fill="var(--sub)" text-anchor="end">↓ 偏干</text>`;
  if(ev.length>1)g+=`<polyline fill="none" stroke="var(--sub)" stroke-opacity=".5" stroke-width="1.5" points="${ev.map((e,i)=>x(i)+','+y(dd(e).s)).join(' ')}"/>`;
  ev.forEach((e,i)=>{const c=dd(e).c,hex=POO_HEX[c]||'var(--poo)';
    g+=`<circle cx="${x(i)}" cy="${y(dd(e).s)}" r="7" fill="${hex}" stroke="${BAD_POO.includes(c)?'var(--danger)':'var(--card)'}" stroke-width="2"/>`;
    if(i===0||i===ev.length-1||ev.length<=7){const d=new Date(e.t);g+=`<text x="${x(i)}" y="${H-6}" font-size="9" fill="var(--sub)" text-anchor="middle">${d.getMonth()+1}/${d.getDate()}</text>`}});
  const ok=ev.filter(e=>dd(e).s>=3&&dd(e).s<=5).length;
  const used=[...new Set(ev.map(e=>dd(e).c).filter(Boolean))];
  $('chartNote').innerHTML=`最近 ${ev.length} 次里 ${ok} 次在正常区。圆点颜色=便便颜色：`+used.map(c=>`<span style="color:${POO_HEX[c]||'inherit'}">●</span>${c}`).join(' ');
  return svg(H,g);
}

function chartHour(){
  const rows=[['pee','尿尿'],['poo','便便'],['drink','喝水奶']];
  const W=340,L=44,R=8,iw=W-L-R,cw=iw/24;
  const cnts=rows.map(([k])=>{const a=Array(24).fill(0);data.events.filter(e=>e.k===k).forEach(e=>a[new Date(e.t).getHours()]++);return a});
  if(!cnts.some(a=>a.some(v=>v>0)))return empty('记几次之后，这里会显示一天里什么时候最常发生');
  let g='';
  rows.forEach(([k,n],r)=>{const y=6+r*34,mx=Math.max(1,...cnts[r]);
    g+=`<text x="2" y="${y+17}" font-size="12" fill="var(--text)">${KINDS[k].e}${n.slice(0,2)}</text>`;
    cnts[r].forEach((v,h)=>{
      g+=`<rect x="${L+h*cw+.5}" y="${y}" width="${cw-1}" height="26" rx="3" fill="${v?`var(--${k})`:'var(--line)'}" fill-opacity="${v?(.25+.75*v/mx).toFixed(2):.45}"/>`;
      if(v)g+=`<text x="${L+h*cw+cw/2}" y="${y+17}" font-size="9" fill="#fff" text-anchor="middle">${v}</text>`});
  });
  [0,6,12,18,23].forEach(h=>g+=`<text x="${L+h*cw+cw/2}" y="${6+3*34+8}" font-size="10" fill="var(--sub)" text-anchor="middle">${h}点</text>`);
  const top=r=>{const m=Math.max(...cnts[r]);return m?cnts[r].indexOf(m)+'点':'—'};
  $('chartNote').textContent=`颜色越深=这个钟点记得越多。最常尿尿：${top(0)} · 最常便便：${top(1)} · 最常喝：${top(2)}`;
  return svg(6+3*34+14,g);
}

function renderChart(){
  const T=$('ctabs');T.innerHTML='';
  CTABS.forEach(([k,n])=>{const b=document.createElement('button');b.className='chip'+(chartTab===k?' on':'');b.textContent=n;b.onclick=()=>{chartTab=k;renderChart()};T.appendChild(b)});
  $('chartNote').textContent='';
  $('chart').innerHTML=({today:chartToday,week:chartWeek,shape:chartShape,hour:chartHour})[chartTab]();
}

function render(){
  interval('pee','peeToday','peeAvg','peeNext');
  interval('poo','pooToday','pooAvg','pooNext');
  $('drinkToday').textContent=of('drink').filter(e=>e.t>=t0()).reduce((s,e)=>s+(Number((e.d||{}).ml)||0),0)+' ml';
  const sh=of('poo').slice(-6).map(e=>(e.d||{}).s).filter(Boolean);
  $('shapes').textContent=sh.length?sh.join(' · ')+' 型':'—';
  tips();
  renderChart();
  const F=$('filters');F.innerHTML='';
  [['all','全部'],...Object.entries(KINDS).map(([k,v])=>[k,v.n])].forEach(([k,n])=>{
    const b=document.createElement('button');b.className='chip'+(filter===k?' on':'');b.textContent=n;b.onclick=()=>{filter=k;render()};F.appendChild(b)});
  const all=[...data.events].sort((a,b)=>b.t-a.t);
  const prevOf={};const asc=[...data.events].sort((a,b)=>a.t-b.t);const gapMap=new Map();
  asc.forEach(e=>{const p=prevOf[e.k];gapMap.set(e.t+e.k,p?e.t-p:null);prevOf[e.k]=e.t});
  const ul=$('list');ul.innerHTML='';
  const shown=all.filter(e=>filter==='all'||e.k===filter).slice(0,200);
  if(!shown.length){ul.innerHTML='<li style="color:var(--sub)">还没有记录，点上面的按钮开始</li>';return}
  shown.forEach(e=>{
    const li=document.createElement('li');
    const g=gapMap.get(e.t+e.k);const dt=detailText(e);
    li.className='ev';
    li.innerHTML=`<div><div class="k">${KINDS[e.k].e} ${KINDS[e.k].n}</div><div class="t">${fmt(e.t)}${g&&e.k!=='other'?' · 距上次'+dur(g):''}</div>${dt?'<div class="dd">'+esc(dt)+'</div>':''}</div><div class="ops"><button data-a="edit">编辑</button><button class="del" data-a="del">删除</button></div>`;
    li.querySelector('[data-a=edit]').onclick=()=>openSheet(e.k,e);
    li.querySelector('[data-a=del]').onclick=()=>{if(confirm('删掉这条记录？'))delEvent(e.t,e.k)};
    ul.appendChild(li);
  });
}

// ---- 弹层 ----
function toast(msg,actionText,fn){
  const el=$('toast');el.textContent=msg;
  if(actionText){const b=document.createElement('button');b.textContent=actionText;b.onclick=()=>{el.style.display='none';fn()};el.appendChild(b)}
  el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',5000);
}
function closeSheet(){$('sheet').style.display='none';$('mask').style.display='none'}
$('mask').onclick=closeSheet;
function chipsHTML(name,opts,cur,cls){
  return `<div class="chips" data-f="${name}">`+opts.map(o=>{
    const arr=Array.isArray(o),v=arr?o[0]:o,l=arr?o[1]:o,sub=arr?o[2]:'';
    return `<button type="button" class="chip ${cls||''}${String(cur)===String(v)?' on':''}" data-v="${esc(v)}">${esc(arr?v+' '+l:l)}${sub?'<small>'+esc(sub)+'</small>':''}</button>`}).join('')+'</div>';
}
function openSheet(kind,ev){
  const editing=!!ev,d=Object.assign({},(ev&&ev.d)||{}),t=ev?ev.t:Date.now();
  const sh=$('sheet');
  const timeFld=`<div class="fld"><div class="lbl">时间${editing?'（要改时间请删掉重记）':''}</div><input type="datetime-local" id="fTime" value="${toLocalInput(t)}" ${editing?'disabled':''}></div>`;
  const noteFld=`<div class="fld"><div class="lbl">备注（可不填）</div><input type="text" id="fNote" maxlength="60" value="${esc(d.n||'')}" placeholder="比如：吃了香蕉、哭闹、肚子胀…"></div>`;
  let body='';
  if(kind==='poo')body=timeFld+`<div class="fld"><div class="lbl">形态（点最像的那个）</div>${chipsHTML('s',SHAPES,d.s,'shape')}</div>
    <div class="fld"><div class="lbl">颜色</div>${chipsHTML('c',POO_COLORS,d.c)}</div>
    <div class="fld"><div class="lbl">量</div>${chipsHTML('q',AMT,d.q)}</div>`+noteFld;
  if(kind==='pee')body=timeFld+`<div class="fld"><div class="lbl">颜色</div>${chipsHTML('c',PEE_COLORS,d.c)}</div>
    <div class="fld"><div class="lbl">量</div>${chipsHTML('q',AMT,d.q)}</div>`+noteFld;
  if(kind==='drink')body=timeFld+`<div class="fld"><div class="lbl">喝的是</div>${chipsHTML('w',['水','奶','其它'],d.w||'水')}</div>
    <div class="fld"><div class="lbl">毫升</div><input type="number" id="fMl" inputmode="numeric" min="0" max="2000" value="${d.ml||''}" placeholder="比如 150">
    <div class="chips" style="margin-top:6px" data-f="mlq">${[50,100,150,200,250].map(n=>`<button type="button" class="chip" data-v="${n}">${n}</button>`).join('')}</div></div>`+noteFld;
  if(kind==='other')body=timeFld+`<div class="fld"><div class="lbl">记什么（点一个，或自己填）</div>${chipsHTML('nm',['体温','吃药','发烧','呕吐','咳嗽','哭闹','睡觉','洗澡'],d.name)}
    <input type="text" id="fName" maxlength="12" style="margin-top:6px" value="${esc(d.name||'')}" placeholder="自己填，比如：体温"></div>
    <div class="fld"><div class="lbl">内容 / 数值</div><input type="text" id="fNote" maxlength="60" value="${esc(d.n||'')}" placeholder="比如：37.8℃、半片退烧药"></div>`;
  sh.innerHTML=`<h2>${KINDS[kind].e} ${editing?'编辑':'记录'}${KINDS[kind].n}</h2>${body}<button class="save" id="fSave">保存</button><button class="cancel" id="fCancel">取消</button>`;
  sh.querySelectorAll('.chips').forEach(box=>{
    box.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
      const f=box.dataset.f,v=c.dataset.v;
      if(f==='mlq'){$('fMl').value=v;return}
      if(f==='nm'){$('fName').value=v;box.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));return}
      const on=c.classList.contains('on');
      box.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
      if(!on||f==='w')c.classList.add('on'); // 再点一次取消选择(喝的种类必选)
    });
  });
  $('fCancel').onclick=closeSheet;
  $('fSave').onclick=()=>{
    const pick=f=>{const c=sh.querySelector(`.chips[data-f="${f}"] .chip.on`);return c?c.dataset.v:''};
    const nd={};
    if(kind==='poo'){const s=pick('s');if(s)nd.s=Number(s);const c=pick('c');if(c)nd.c=c;const q=pick('q');if(q)nd.q=q}
    if(kind==='pee'){const c=pick('c');if(c)nd.c=c;const q=pick('q');if(q)nd.q=q}
    if(kind==='drink'){nd.w=pick('w')||'水';const ml=Number($('fMl').value);if(ml>0)nd.ml=ml}
    if(kind==='other'){nd.name=$('fName').value.trim()||'其它'}
    const n=$('fNote').value.trim();if(n)nd.n=n;
    let tt=t;
    if(!editing){const v=$('fTime').value;tt=v?new Date(v).getTime():Date.now();if(isNaN(tt))tt=Date.now()}
    closeSheet();putEvent(tt,kind,nd);
    if(kind==='poo'){const c=nd.c;if(c==='红/带血'||c==='黑'||c==='白灰')toast('颜色不常见，建议拍照问医生')}
  };
  $('mask').style.display='block';sh.style.display='block';sh.scrollTop=0;
}

$('bPee').onclick=()=>{const t=Date.now();putEvent(t,'pee',{});toast('已记尿尿','补充颜色/量',()=>openSheet('pee',{t,k:'pee',d:{}}))};
$('bPoo').onclick=()=>openSheet('poo');
$('bDrink').onclick=()=>openSheet('drink');
$('bOther').onclick=()=>openSheet('other');
$('exp').onclick=()=>{const b=new Blob([JSON.stringify({events:data.events},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='宝宝记录备份.json';a.click()};
setInterval(render,60000);
setInterval(sync,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
render();sync();
</script>
