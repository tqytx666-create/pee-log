<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>时间记录小本</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--text:#1f1f1f;--sub:#7a7a7a;--accent:#2f6f5e;--line:#e6e4df;--danger:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--card:#222;--text:#eee;--sub:#999;--accent:#5fb89e;--line:#333;--danger:#e57368}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,"PingFang SC",sans-serif}
main{max-width:480px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:18px;margin:0 0 16px;display:flex;align-items:center;gap:8px}
h1 input{font:inherit;font-weight:600;border:none;border-bottom:1px dashed var(--line);background:transparent;color:inherit;width:8em;padding:2px 0}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;border:1px solid var(--line)}
button{font:inherit;cursor:pointer}
#rec{width:100%;padding:18px;font-size:20px;font-weight:600;border:none;border-radius:14px;background:var(--accent);color:#fff}
#rec:active{transform:scale(.98)}
.next{font-size:13px;color:var(--sub)}
.big{font-size:26px;font-weight:700;margin:2px 0}
.row{display:flex;justify-content:space-between;gap:12px}
.row>div{flex:1}
.lbl{font-size:12px;color:var(--sub)}
.val{font-size:18px;font-weight:600}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:none}
li small{color:var(--sub);margin-left:8px}
li button{border:none;background:none;color:var(--danger);font-size:13px}
.add{display:flex;gap:8px}
.add input{flex:1;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.add button{padding:8px 14px;border-radius:8px;border:1px solid var(--accent);background:none;color:var(--accent)}
.foot{text-align:center;font-size:12px;color:var(--sub)}
.foot button{border:none;background:none;color:var(--sub);text-decoration:underline;font-size:12px}
</style>
</head>
<body>
<main>
  <h1>记录：<input id="name" maxlength="10" placeholder="起个名字"></h1>

  <button id="rec">现在记一次</button>

  <div class="card" style="margin-top:14px">
    <div class="next">预计下一次</div>
    <div class="big" id="nextTime">—</div>
    <div class="next" id="nextHint">至少记录 2 次后才能预测</div>
  </div>

  <div class="card">
    <div class="row">
      <div><div class="lbl">今天</div><div class="val" id="today">0 次</div></div>
      <div><div class="lbl">共记录</div><div class="val" id="cnt">0 次</div></div>
      <div><div class="lbl">平均间隔</div><div class="val" id="avg">—</div></div>
      <div><div class="lbl">最近3次平均</div><div class="val" id="avg3">—</div></div>
    </div>
    <div class="row" style="margin-top:12px">
      <div><div class="lbl">常在几点</div><div class="val" id="hour">—</div></div>
      <div><div class="lbl">距上一次</div><div class="val" id="since">—</div></div>
    </div>
  </div>

  <div class="card">
    <div class="lbl" style="margin-bottom:8px">补记一次（忘了点的时候）</div>
    <div class="add"><input type="datetime-local" id="manual"><button id="addBtn">补记</button></div>
  </div>

  <div class="card">
    <div class="lbl" style="margin-bottom:4px">记录（新的在上面）</div>
    <ul id="list"></ul>
  </div>

  <div class="foot"><span id="sync"></span> · <button id="exp">导出备份</button></div>
</main>

<script>
const SB='https://oznaumvwecurqmfjqwne.supabase.co', KEYAPI='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im96bmF1bXZ3ZWN1cnFtZmpxd25lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4OTE2NTEsImV4cCI6MjEwMjQ2NzY1MX0.bJfcVFpFspYdmwoeb_tDu77_IJsSfk8alJbtNrsJgPI';
const KEY='timelog.v1';
// 口令:从链接 #k=xxxx 读取并记住;口令不进代码仓库
let code='';
try{const m=location.hash.match(/k=([A-Za-z0-9_-]{12,})/);if(m){localStorage.setItem('timelog.code',m[1]);history.replaceState(null,'',location.pathname)}code=localStorage.getItem('timelog.code')||''}catch(e){}
let data={name:'儿子尿尿',times:[],pending:[]};
try{const s=localStorage.getItem(KEY);if(s)Object.assign(data,JSON.parse(s))}catch(e){}
data.pending=data.pending||[];
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const p2=n=>String(n).padStart(2,'0');
const fmt=t=>{const d=new Date(t);return `${d.getMonth()+1}月${d.getDate()}日 ${p2(d.getHours())}:${p2(d.getMinutes())}`};
const dur=ms=>{const m=Math.round(ms/60000);if(m<60)return m+'分钟';const h=Math.floor(m/60),r=m%60;if(h<48)return h+'小时'+(r?r+'分':'');const d=Math.floor(h/24);return d+'天'+(h%24)+'小时'};
const dayWord=t=>{const d=new Date(t),n=new Date();const a=new Date(d.getFullYear(),d.getMonth(),d.getDate()),b=new Date(n.getFullYear(),n.getMonth(),n.getDate());const k=Math.round((a-b)/864e5);return k===0?'今天':k===1?'明天':k===-1?'昨天':k===2?'后天':''};

// ---- 云同步(没口令就只存本机)----
async function rpc(fn,body){
  const r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEYAPI,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error(fn+' '+r.status);
  return r.status===204?null:r.json();
}
function status(t,bad){const e=$('sync');e.textContent=t;e.style.color=bad?'var(--danger)':'var(--sub)'}
let syncing=false;
async function sync(){
  if(!code){status('只存在本机（没有口令，用带口令的链接打开才会同步）');return}
  if(syncing)return;syncing=true;
  try{
    while(data.pending.length){
      const op=data.pending[0];
      await rpc(op.op==='add'?'pl_add':'pl_del',{p_code:code,p_ms:op.ms});
      data.pending.shift();save();
    }
    const list=await rpc('pl_list',{p_code:code});
    data.times=list;save();render();
    status('已同步 · '+p2(new Date().getHours())+':'+p2(new Date().getMinutes()));
  }catch(e){status('同步失败，已先存在本机，稍后自动重试',true)}
  syncing=false;
}
function addTime(t){data.times.push(t);data.pending.push({op:'add',ms:t});save();render();sync()}
function delTime(t){data.times=data.times.filter(x=>x!==t);data.pending.push({op:'del',ms:t});save();render();sync()}

function render(){
  const ts=[...data.times].sort((a,b)=>a-b);
  $('name').value=data.name||'';
  $('cnt').textContent=ts.length+' 次';
  const t0=new Date();t0.setHours(0,0,0,0);
  $('today').textContent=ts.filter(t=>t>=t0.getTime()).length+' 次';
  const gaps=[];for(let i=1;i<ts.length;i++)gaps.push(ts[i]-ts[i-1]);
  const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
  const avg=gaps.length?mean(gaps):null;
  const avg3=gaps.length?mean(gaps.slice(-3)):null;
  $('avg').textContent=avg?dur(avg):'—';
  $('avg3').textContent=avg3?dur(avg3):'—';
  if(ts.length){
    const last=ts[ts.length-1];
    $('since').textContent=dur(Date.now()-last);
    const hc={};ts.forEach(t=>{const h=new Date(t).getHours();hc[h]=(hc[h]||0)+1});
    const top=Object.entries(hc).sort((a,b)=>b[1]-a[1])[0];
    $('hour').textContent=top[0]+' 点左右';
  }else{$('since').textContent='—';$('hour').textContent='—'}
  if(avg){
    const nx=ts[ts.length-1]+avg,over=nx<Date.now();
    $('nextTime').textContent=(dayWord(nx)+' '+p2(new Date(nx).getHours())+':'+p2(new Date(nx).getMinutes())).trim();
    $('nextHint').textContent=over?`按平均间隔 ${dur(avg)}，已经超过预计时间 ${dur(Date.now()-nx)}`:`按平均间隔 ${dur(avg)}，还有约 ${dur(nx-Date.now())}`;
  }else{$('nextTime').textContent='—';$('nextHint').textContent='至少记录 2 次后才能预测'}
  const ul=$('list');ul.innerHTML='';
  [...ts].reverse().forEach((t,i,arr)=>{
    const li=document.createElement('li');
    const prev=arr[i+1];
    li.innerHTML=`<span>${fmt(t)}<small>${prev?'距上次 '+dur(t-prev):''}</small></span>`;
    const b=document.createElement('button');b.textContent='删除';
    b.onclick=()=>{if(confirm('删掉这条记录？'))delTime(t)};
    li.appendChild(b);ul.appendChild(li);
  });
}
$('rec').onclick=()=>addTime(Date.now());
$('addBtn').onclick=()=>{const v=$('manual').value;if(!v)return;const t=new Date(v).getTime();if(isNaN(t))return;$('manual').value='';addTime(t)};
$('name').oninput=e=>{data.name=e.target.value;save()};
$('exp').onclick=()=>{const b=new Blob([JSON.stringify({name:data.name,times:data.times},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='时间记录备份.json';a.click()};
setInterval(render,60000);
setInterval(sync,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
render();sync();
</script>
</body>
</html>
